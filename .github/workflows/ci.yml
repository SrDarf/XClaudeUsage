name: ci

# Minimal quality gate for the Node.js implementation on the main branch.
# This file lives only on main; the Rust rewrite (HighPerformanceXClaudeUsage
# branch) has its own ci.yml running fmt/clippy/test/audit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: node --check + statusline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every script
        run: |
          for f in *.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Statusline smoke (must not crash on empty or typical input)
        run: |
          echo '{}' | node xclaude-usage.js
          echo
          printf '%s' '{"model":{"display_name":"claude-sonnet-4-6"},"workspace":{"current_dir":"/tmp"},"session_id":"smoke","transcript_path":"/tmp/does-not-exist.jsonl"}' | node xclaude-usage.js
          echo
          printf '%s' '{"model":{"display_name":"claude-opus-5-5"},"workspace":{"current_dir":"/tmp"},"rate_limits":{"seven_day":{"used_percentage":39,"resets_at":4102444800}}}' | node xclaude-usage.js | grep -q '36m'
          echo
          echo "statusline smoke ok"
